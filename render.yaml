# =====================================================================
# render.yaml — Render Blueprint for Morvarid-Farm
#
# Three services:
#   - morvarid-farm-spa  : Static SPA (vite singlefile dist/index.html)
#   - morvarid-farm-bff  : Node BFF, holds service-role key server-side only
#   - morvarid-export-api: Node XLSX export API (user-JWT scoped, no secrets)
#
# Wire to a secret group called `morvarid-prod-secrets` with keys:
#   - VITE_SUPABASE_URL
#   - VITE_SUPABASE_ANON_KEY
#   - VITE_SUPABASE_SERVICE_ROLE_KEY (BFF only, never on the SPA)
#   - SUPABASE_URL (export-api legacy name, same value as VITE_SUPABASE_URL)
#   - SUPABASE_ANON_KEY (export-api legacy name)
#   - ALLOWED_ORIGIN
#
# Do NOT add secret values to this file. Secrets live in the Render
# dashboard secret group, not here.
# =====================================================================

services:
  # Static SPA (existing).
  - type: web
    name: morvarid-farm-spa
    runtime: static
    rootDir: .
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      # The whole app is inlined into a single index.html (vite-plugin-
      # singlefile), so there are no content-hashed assets to cache long-term.
      # no-cache forces every request to revalidate against the origin, which
      # is what guarantees a freshly opened session always loads the latest
      # build without the user ever clearing cache manually.
      - path: /*
        name: Cache-Control
        value: no-cache
      - path: /*
        name: Strict-Transport-Security
        value: max-age=63072000; includeSubDomains; preload
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=(), usb=()
      # Report-Only first: collect violations for a week via report-uri,
      # then flip to enforcing Content-Security-Policy. Enforcing on day
      # one with a singlefile inlined bundle + Google Fonts risks breaking
      # prod for real users.
      - path: /*
        name: Content-Security-Policy-Report-Only
        value: default-src 'self'; script-src 'self' 'unsafe-inline' https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'

  # BFF — Supabase auth.admin proxy, service-role stays server-side.
  - type: web
    name: morvarid-farm-bff
    runtime: node
    rootDir: bff
    buildCommand: npm install --no-audit --no-fund
    startCommand: node server.mjs
    healthCheckPath: /health
    envVars:
      - key: VITE_SUPABASE_URL
        fromGroup: morvarid-prod-secrets
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        fromGroup: morvarid-prod-secrets
        sync: false
      - key: VITE_SUPABASE_SERVICE_ROLE_KEY
        fromGroup: morvarid-prod-secrets
        sync: false
      - key: ALLOWED_ORIGIN
        fromGroup: morvarid-prod-secrets
        sync: false
      - key: NODE_ENV
        value: production

  # NEW — server-side XLSX export API.
  - type: web
    name: morvarid-export-api
    runtime: node
    rootDir: services/export-api
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        fromGroup: morvarid-prod-secrets
        sync: false
      - key: SUPABASE_ANON_KEY
        fromGroup: morvarid-prod-secrets
        sync: false
      - key: ALLOWED_ORIGIN
        value: https://morvarid-farm-spa.onrender.com
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
